# Despliegue de la API en Render · Botica San Juan
#
# POR QUE RENDER Y NO RAILWAY
#
# La prueba gratuita de Railway dura siete dias o cinco dolares, lo que
# ocurra antes. Un enlace de entrega academica que la profesora abre tres
# semanas despues estaria muerto. La capa gratuita de Render no caduca: el
# servicio se duerme tras quince minutos sin trafico y despierta solo en la
# primera peticion, que tarda unos cincuenta segundos. Es un arranque lento,
# no una caida, y para este uso es el intercambio correcto.
#
# LA BASE DE DATOS NO SE DEFINE AQUI
#
# Vive en Neon y ya esta poblada con el catalogo. Render solo necesita la
# cadena de conexion, que se carga a mano en el panel y NUNCA se versiona.
#
# PUESTA EN MARCHA
#
#   1. render.com -> New -> Blueprint -> conectar este repositorio.
#   2. Render lee este archivo y propone el servicio.
#   3. Antes de desplegar, cargar en Environment las cuatro variables
#      marcadas abajo como sync: false. Los valores estan en el panel de
#      Neon (usar el endpoint DIRECTO, no el -pooler).
#   4. Desplegar. Antes de escuchar, el entrypoint cachea la configuracion,
#      aplica las migraciones, siembra las cuentas de demostracion y crea el
#      enlace public/storage. No hay buildCommand: todo eso vive en
#      docker/entrypoint.sh, que corre en CADA arranque y no solo al construir.
#
# AVISO SOBRE LOS ARCHIVOS SUBIDOS
#
# El disco de este contenedor es efimero. El enlace de storage hace que los
# archivos del disco publico se SIRVAN, no que PERSISTAN: una foto subida
# desde el panel desaparece en el siguiente despliegue. Para que persista hace
# falta almacenamiento de objetos. Ver docker/entrypoint.sh.

services:
  - type: web
    name: botica-san-juan-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    rootDir: botica-san-juan-backend
    dockerfilePath: ./Dockerfile
    # Comprobacion de vida sin autenticacion: una comprobacion que exige
    # sesion no sirve cuando lo que falla es precisamente la sesion.
    healthCheckPath: /api/salud
    envVars:
      - key: APP_NAME
        value: Botica San Juan
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"          # en produccion, un error no debe revelar el stack
      - key: LOG_CHANNEL
        value: stderr           # el disco del contenedor es efimero
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require          # Neon no acepta conexiones sin cifrar
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # /docs/api y /docs/v1 quedan abiertas SIN declarar nada: el valor por
      # omision de config/scramble.php ya es true, justamente para que
      # publicarlas no dependa de acordarse de anadir una variable en el
      # panel. Se deja escrita y comentada para que se vea que existe y como
      # se cierra. Ver docs/API-PUBLICA.md.
      # - key: SCRAMBLE_DOCUMENTACION_PUBLICA
      #   value: "false"

      # --- Se cargan a mano en el panel. No se versionan. ---
      - key: APP_KEY
        sync: false             # php artisan key:generate --show
      - key: DB_URL
        sync: false             # cadena de Neon, endpoint DIRECTO
      - key: APP_URL
        sync: false             # la URL que Render asigne a este servicio
      - key: CORS_ALLOWED_ORIGINS
        sync: false             # la URL del front en Vercel, exacta y sin barra final
      # Los nombres los fija config/demostracion.php, que es de donde los lee
      # el seeder. Si no coinciden, el arranque omite las cuentas en silencio.
      - key: DEMO_ADMIN_PASSWORD
        sync: false             # cuenta de demostracion, DNI 10000001
      - key: DEMO_CLIENTE_PASSWORD
        sync: false             # cuenta de demostracion, DNI 10000002
