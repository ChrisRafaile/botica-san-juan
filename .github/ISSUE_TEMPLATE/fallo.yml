name: Reportar un fallo
description: Algo del sistema no hace lo que debería
labels: ["fallo"]
body:
  - type: markdown
    attributes:
      value: |
        Si el fallo afecta a una venta en curso o al stock, márcalo como
        bloqueante: en un mostrador eso detiene el trabajo.

  - type: textarea
    id: que-pasa
    attributes:
      label: Qué ocurre
      description: Qué hiciste, qué esperabas y qué pasó en su lugar.
      placeholder: |
        1. Abrí el punto de venta
        2. Busqué "PARACETAMOL" y pulsé Enter
        3. Esperaba que se agregara al carrito
        4. En su lugar el carrito quedó vacío
    validations:
      required: true

  - type: dropdown
    id: gravedad
    attributes:
      label: Gravedad
      options:
        - Bloqueante — no se puede vender o el stock queda mal
        - Alta — hay que dar un rodeo para trabajar
        - Media — molesta pero se puede seguir
        - Baja — detalle visual
    validations:
      required: true

  - type: input
    id: donde
    attributes:
      label: En qué pantalla
      placeholder: /admin/pos
    validations:
      required: true

  - type: textarea
    id: entorno
    attributes:
      label: Entorno
      placeholder: |
        Navegador:
        Usuario y rol:
        ¿Local o producción?
