name: Historia de usuario
description: Una necesidad del negocio expresada como lo que alguien quiere hacer
labels: ["historia"]
body:
  - type: input
    id: codigo
    attributes:
      label: Código
      placeholder: HU-12
    validations:
      required: true

  - type: textarea
    id: historia
    attributes:
      label: Historia
      value: |
        Como [rol]
        quiero [qué]
        para [para qué].
    validations:
      required: true

  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      description: Condiciones verificables. Si no se puede comprobar, no es un criterio.
      value: |
        - [ ] Dado ... cuando ... entonces ...
        - [ ] Dado ... cuando ... entonces ...
    validations:
      required: true

  - type: textarea
    id: reglas
    attributes:
      label: Reglas de negocio que aplican
      description: |
        Lo que el sistema no puede violar aunque el usuario lo pida. Por ejemplo:
        el stock nunca queda negativo, el IGV se extrae del precio y no se suma,
        todo cambio de inventario deja movimiento con motivo.

  - type: textarea
    id: fuera
    attributes:
      label: Qué queda fuera
      description: Delimitar evita que la historia crezca sin control durante el sprint.
