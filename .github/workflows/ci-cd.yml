name: CI/CD

on:
  push:
    branches:
      - master
      - main
      - '*.x'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run secret scan gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/security-evidence
          pwsh -File ./infra/security/scan_secrets.ps1 2>&1 | tee logs/security-evidence/secrets-scan-ci.txt

  backend-tests:
    runs-on: ubuntu-latest
    needs: secrets-scan
    defaults:
      run:
        working-directory: botica-san-juan-backend

    # Las pruebas corren sobre PostgreSQL 16, el mismo motor que produccion
    # (phpunit.xml fija DB_CONNECTION=pgsql y DB_DATABASE=botica_san_juan_test).
    # SQLite no sirve: no entiende GREATEST, FILTER (WHERE ...) ni ILIKE.
    # El servicio crea la base de pruebas al arrancar; las credenciales son
    # desechables y solo existen dentro de este job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: botica_san_juan_test
        ports:
          - 5432:5432
        # Sin la espera de salud, las pruebas arrancarian antes de que la
        # base acepte conexiones y fallarian con "connection refused".
        options: >-
          --health-cmd "pg_isready -U postgres -d botica_san_juan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Las variables de entorno del proceso prevalecen sobre el .env copiado
    # de .env.example, asi que la conexion no depende de ese archivo.
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: botica_san_juan_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # composer.json exige PHP ^8.4 y composer.lock se resolvio para
          # 8.4.1: con 8.3 "composer install" aborta en la comprobacion de
          # plataforma antes de llegar a las pruebas.
          php-version: '8.4'
          # pdo_pgsql es el controlador que usan las pruebas y produccion.
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pgsql, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run backend tests
        run: php artisan test

  frontend-build:
    runs-on: ubuntu-latest
    needs: secrets-scan
    defaults:
      run:
        working-directory: botica-san-juan-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # pnpm se instala antes que Node: así setup-node encuentra el gestor y
      # puede cachear su almacén de paquetes.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: botica-san-juan-frontend/pnpm-lock.yaml

      # --frozen-lockfile falla si package.json y el lockfile no concuerdan,
      # en lugar de resolver versiones nuevas en silencio. Es el equivalente
      # de "npm ci" y lo que garantiza builds reproducibles.
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check and build frontend
        run: pnpm run build
