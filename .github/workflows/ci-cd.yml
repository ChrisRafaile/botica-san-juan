name: CI/CD

on:
  push:
    branches:
      - master
      - main
      - '*.x'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run secret scan gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/security-evidence
          pwsh -File ./infra/security/scan_secrets.ps1 2>&1 | tee logs/security-evidence/secrets-scan-ci.txt

  backend-tests:
    runs-on: ubuntu-latest
    needs: secrets-scan
    defaults:
      run:
        working-directory: botica-san-juan-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # pdo_pgsql se instala porque produccion corre sobre PostgreSQL 16;
          # las pruebas usan SQLite en memoria segun phpunit.xml.
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pgsql, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run backend tests
        run: php artisan test

  frontend-build:
    runs-on: ubuntu-latest
    needs: secrets-scan
    defaults:
      run:
        working-directory: botica-san-juan-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # pnpm se instala antes que Node: así setup-node encuentra el gestor y
      # puede cachear su almacén de paquetes.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: botica-san-juan-frontend/pnpm-lock.yaml

      # --frozen-lockfile falla si package.json y el lockfile no concuerdan,
      # en lugar de resolver versiones nuevas en silencio. Es el equivalente
      # de "npm ci" y lo que garantiza builds reproducibles.
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check and build frontend
        run: pnpm run build
