; Endurecimiento del interprete PHP en produccion.
; ============================================================================
; Motivo: aviso de seguridad de PHP del 21 de octubre de 2026.
;
;   CVE-2026-109618  RCE por corrupcion durante el manejo de falta de memoria
;   CVE-2026-109619  RCE por estado global superviviente entre peticiones
;
; Ambas con CVSS v4.0 9.2 y ejecucion remota de codigo SIN autenticar. El
; aviso nombra explicitamente a FrankenPHP entre los entornos afectados, que
; es justo el que sirve esta API.
;
; LO QUE DE VERDAD ARREGLA EL PROBLEMA ES ACTUALIZAR, no este archivo. La
; propia advertencia lo dice sin rodeos: «no hay mitigaciones completas,
; actualizar es la unica opcion segura». La imagen base ya esta en PHP 8.4.27
; y el arranque lo verifica. Lo de aqui es defensa en profundidad: reduce la
; superficie por si aparece una variante antes del siguiente parche.
; ============================================================================

; --- CVE-2026-109619 -------------------------------------------------------
; El seguimiento de progreso de subida guarda estado en la sesion durante el
; parseo de la peticion, antes de que corra una sola linea de la aplicacion.
; Es la ruta confirmada del fallo. Esta API no lo usa en ninguna pantalla: la
; carga masiva y las imagenes de producto suben el archivo entero y responden
; al terminar, sin barra de progreso.
session.upload_progress.enabled = 0

; --- CVE-2026-109618 -------------------------------------------------------
; Un cuerpo de peticion enorme es la forma comoda de provocar el fallo de
; asignacion de memoria que dispara la ruta vulnerable. Se acota al tamano
; que el negocio necesita de verdad, medido contra las reglas de validacion
; del codigo:
;
;     catalogo DIGEMID   DigemidCatalogoController  max:10240 KB  = 10 MB
;     imagen de producto ProductoController         max:2048  KB  =  2 MB
;
; 16 MB deja holgura sobre el archivo mas grande que se acepta, y 32 MB en el
; POST cubre ese archivo mas los campos que lo acompanan. Subir de ahi seria
; regalar superficie de ataque a cambio de nada.
post_max_size = 32M
upload_max_filesize = 16M

; --- Higiene general -------------------------------------------------------
; La API respondia con `X-Powered-By: PHP/8.4.27` en cada peticion, es decir,
; publicaba la version exacta del interprete a cualquiera que mirase las
; cabeceras. Eso no abre ningun agujero por si solo, pero en el proximo aviso
; de seguridad le ahorra a un atacante el trabajo de averiguar si este
; servidor es uno de los vulnerables: se lo decimos nosotros.
expose_php = Off

; NO se pone `memory_limit = -1`, aunque el aviso lo sugiera.
;
; Esa recomendacion asume que hay un limite de cgroup debajo que actua como
; frontera de disponibilidad, matando solo al worker afectado. Aqui el
; contenedor ES el worker: con memoria ilimitada en PHP, una peticion
; desbocada se lleva por delante el contenedor entero y el orquestador lo
; reinicia, es decir, cambia un error 500 acotado por una caida del servicio.
; En un unico contenedor pequeno eso empeora el riesgo real en lugar de
; mejorarlo, y el interprete ya esta parcheado. Se deja el limite por defecto.
